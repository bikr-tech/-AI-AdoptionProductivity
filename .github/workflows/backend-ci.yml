name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Bootstrap (generate data + train model)
        run: python -c "from app.main import _bootstrap; _bootstrap()"

      - name: Start server & smoke test
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          sleep 5
          curl -s http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          echo "Health OK"
          curl -s -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"industry":"Technology","location":"US","primary_ai_tool":"ChatGPT","daily_token_usage":5000,"tasks_automated_per_week":15,"experience_years":3.5}' \
            | grep -q '"productivity_gain_percent"'
          echo "Predict OK"
          curl -s http://127.0.0.1:8000/analytics/summary | grep -q '"total_respondents"'
          echo "Analytics OK"
      - name: Deploy to Render
              if: github.ref == 'refs/heads/main' && github.event_name == 'push'
              uses: johnbeynon/render-deploy-action@v0.0.8
              with:
                service-id: ${{ secrets.RENDER_SERVICE_ID }}
                api-key: ${{ secrets.RENDER_API_KEY }}